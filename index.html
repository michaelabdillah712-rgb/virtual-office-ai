
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Office AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      color: #e8eefc;
      background: #101827;
    }
    main {
      max-width: 430px;
      margin: 35px auto;
      padding: 24px;
      background: #1b2639;
      border: 1px solid #35445c;
      border-radius: 18px;
    }
    h1 { margin-bottom: 8px; }
    p { color: #b7c4d9; line-height: 1.5; }
    label { display: block; margin-top: 15px; }
    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #53647e;
      background: #101827;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #68a5ff;
      color: #101827;
      font-weight: bold;
      font-size: 15px;
    }
    button.secondary {
      background: #35445c;
      color: white;
    }
    #status {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>🏢 Virtual Office AI</h1>
    <p>Kantor virtualmu dimulai di sini.</p>

    <section id="authPanel">
      <h2 id="formTitle">Daftar Karyawan</h2>


      
      <form id="authForm">
        <div id="nameField">
  <label for="name">Nama karyawan</label>
  <input id="name" type="text"
    maxlength="60" autocomplete="name"
    placeholder="Nama kamu">
</div>

        

        <label for="email">Email</label>
        <input id="email" type="email"
          autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          minlength="8" autocomplete="new-password"
          required>

        <button id="submitBtn" type="submit">
          Daftar
        </button>
      </form>

      <button id="switchBtn" class="secondary" type="button">
        Sudah punya akun? Login
      </button>
    </section>

    <section id="profilePanel" hidden>
      <h2>Profil Karyawan</h2>
      <p id="profileName"></p>
      <p id="profileJob"></p>
      <p id="profileDepartment"></p>
      <button id="logoutBtn" type="button">Logout</button>
    </section>

    <p id="status" role="status" aria-live="polite">
      Halaman siap. Koneksi Supabase belum diaktifkan.
    </p>
  </main>



<section id="dashboard" hidden>
  <h2>🏢 Virtual Office</h2>

  <div class="dashboard-card">
    <h3>💰 Dompet Virtual</h3>
    <p>Saldo koin: <strong id="coinBalance">0</strong> 🪙</p>
  </div>

  <div class="dashboard-card">
    <h3>📋 Tambah Tugas</h3>
    <form id="taskForm">
      <input
        id="taskTitle"
        type="text"
        placeholder="Nama tugas"
        required
      />

      <textarea
        id="taskDescription"
        placeholder="Deskripsi tugas (opsional)"
      ></textarea>

      <button type="submit">Tambah Tugas</button>
    </form>
  </div>

  <div class="dashboard-card">
    <h3>🗂️ Daftar Tugas</h3>
    <p id="taskMessage">Belum ada tugas.</p>
    <div id="taskList"></div>
  </div>
</section>


  
<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  // GANTI DENGAN NILAI DARI DASHBOARD SUPABASE
  const SUPABASE_URL = "https://ttdpkcywrjujwejhnayr.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_RVwgBlY6jv9sK0I2JxU-zA_tFM_0lVc";

  const status = document.getElementById("status");
  const authForm = document.getElementById("authForm");
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const formTitle = document.getElementById("formTitle");
  const submitBtn = document.getElementById("submitBtn");
  const switchBtn = document.getElementById("switchBtn");
  const authPanel = document.getElementById("authPanel");
  const profilePanel = document.getElementById("profilePanel");

  let isLogin = false;
  let busy = false;

  const configReady =
    SUPABASE_URL.startsWith("https://") &&
    SUPABASE_URL.endsWith(".supabase.co") &&
    SUPABASE_PUBLISHABLE_KEY.length > 10 &&
    !SUPABASE_PUBLISHABLE_KEY.includes("TEMPEL_");

  if (!configReady) {
    status.textContent =
      "Konfigurasi belum lengkap. Isi Project URL dan publishable key.";
  } else {
    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    
async function loadTasks() {
  const { data: { user } } = await supabase.auth.getUser();

  if (!user) return;

  const { data, error } = await supabase
    .from("tasks")
    .select("*")
    .eq("user_id", user.id)
    .order("title");

  const taskList = document.getElementById("taskList");
  const taskMessage = document.getElementById("taskMessage");

  if (error) {
    taskMessage.textContent = "Gagal memuat tugas: " + error.message;
    return;
  }

  taskList.replaceChildren();

  if (!data || data.length === 0) {
    taskMessage.textContent = "Belum ada tugas. Tambahkan tugas pertamamu!";
    return;
  }

  taskMessage.textContent = "Jumlah tugas: " + data.length;

  data.forEach((task) => {
    const item = document.createElement("div");
    const title = document.createElement("h4");
    const description = document.createElement("p");
    const status = document.createElement("p");

    title.textContent = task.title;
    description.textContent = task.description || "Tanpa deskripsi";
    status.textContent = "Status: " + task.status;

    item.append(title, description, status);
    taskList.appendChild(item);
  });
}


    function showMessage(message) {
      status.textContent = message;
    }

    async function loadProfile(user) {
      const { data, error } = await supabase
        .from("profiles")
        .select("display_name, job_title, department")
        .eq("id", user.id)
        .single();

      if (error) {
        showMessage(
          "Login berhasil, tetapi profil belum dapat dibaca. " +
          "Periksa trigger dan kebijakan RLS."
        );
        return;
      }

      document.getElementById("profileName").textContent =
        "Nama: " + data.display_name;
      document.getElementById("profileJob").textContent =
        "Jabatan: " + data.job_title;
      document.getElementById("profileDepartment").textContent =
        "Departemen: " + data.department;
      document.getElementById("dashboard").hidden = false;

      authPanel.hidden = true;
      profilePanel.hidden = false;
      showMessage("Berhasil masuk ke Virtual Office AI.");
    }

    switchBtn.addEventListener("click", () => {
      isLogin = !isLogin;

      formTitle.textContent = isLogin
        ? "Login Karyawan" : "Daftar Karyawan";
      submitBtn.textContent = isLogin ? "Login" : "Daftar";
      switchBtn.textContent = isLogin
        ? "Belum punya akun? Daftar"
        : "Sudah punya akun? Login";

      nameInput.required = !isLogin;
      document.getElementById("nameField").hidden = isLogin;
      passwordInput.autocomplete = isLogin
        ? "current-password" : "new-password";

      showMessage("Mode " + (isLogin ? "login" : "pendaftaran") + ".");
    });

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      busy = true;
      submitBtn.disabled = true;
      showMessage("Memproses...");

      try {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (isLogin) {
          const { data, error } = await supabase.auth
            .signInWithPassword({ email, password });

          if (error) throw error;

          await loadProfile(data.user);
        } else {
          const displayName = nameInput.value.trim();

          if (!displayName) {
            throw new Error("Masukkan nama karyawan.");
          }

          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: { display_name: displayName }
            }
          });

          if (error) throw error;

          if (data.session && data.user) {
            await loadProfile(data.user);
          } else {
            showMessage(
              "Pendaftaran diterima. Periksa email untuk " +
              "konfirmasi, lalu login setelah akun aktif."
            );
          }
        }
      } catch (error) {
        showMessage("Gagal: " + error.message);
      } finally {
        busy = false;
        submitBtn.disabled = false;
      }
    });

    document.getElementById("logoutBtn")
      .addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();

        if (error) {
          showMessage("Logout gagal: " + error.message);
          return;
        }

        profilePanel.hidden = true;
        authPanel.hidden = false;
        authForm.reset();
        showMessage("Kamu sudah logout.");
      });

    // Memulihkan sesi jika pengguna sebelumnya sudah login.
    const { data, error } = await supabase.auth.getSession();

    if (error) {
      showMessage("Gagal memeriksa sesi login.");
    } else if (data.session) {
      await loadProfile(data.session.user);
    } else {
      showMessage("Supabase terhubung. Silakan daftar atau login.");
    }
  }
</script>

</body>
</html>
